<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BİLGEM Kurumsal Rehber</title>
<style>
/* Kurumsal Rehber: İdari Destek ve Filo raporlarıyla aynı aile (Your Own KPI yazı ve renk dili, 28.09.2026).
   Grafik ve tarih aralığı yok: arama, enstitü/EMY/birim süzgeçleri ve tam sayfa tablo. */
:root{--bant1:#5D80C6;--bant2:#5D8ABF;--bant3:#599CAB;--mavi:#3F68BD;--metin:#5B5B78;--gri:#9090AD}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#C9D2EA;color:#5B5B78;font-family:"Segoe UI","Segoe UI Web (West European)",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",sans-serif}
button,input,select{font-family:inherit}
#sahne{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:linear-gradient(135deg,#D9DFF1 0%,#C1CCE2 55%,#B4C4E1 100%)}
.menu{position:absolute;z-index:10;left:24px;top:28px;width:96px;height:664px;border-radius:12px;background:linear-gradient(180deg,#EEF1F4 0%,#D7DFE6 100%);box-shadow:0 6px 16px rgba(80,95,140,.25),inset 0 1px 0 rgba(255,255,255,.8);display:flex;flex-direction:column;align-items:center;padding-top:12px}
.menu .logo{width:66px;height:auto;margin-bottom:2px}
.mdug{appearance:none;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;margin-top:9px;color:#9090AD;font-size:13px}
.mdug .kut{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(180deg,#F5F7FA,#E3E8EE);box-shadow:0 2px 6px rgba(80,95,140,.2),inset 0 1px 0 #fff;color:#9090AD;transition:.15s}
.mdug:hover .kut{transform:translateY(-1px)}
.mdug .kut svg{width:28px;height:28px}
.mdug.secili{color:#5B5B78}.mdug.secili .kut{background:linear-gradient(135deg,#5D80C6 0%,#599CAB 100%);color:#F2F2FF;box-shadow:0 4px 10px rgba(80,110,190,.4)}
.menu .alt-not{margin-top:auto;margin-bottom:12px;font-size:10.5px;color:#9090AD;text-align:center;line-height:1.4;padding:0 6px}
.bant{position:absolute;left:134px;top:28px;width:1122px;height:96px;border-radius:14px;background:linear-gradient(115deg,var(--bant1) 0%,var(--bant2) 55%,var(--bant3) 100%);box-shadow:0 8px 20px rgba(70,95,160,.3);display:flex;align-items:center;gap:22px;padding:0 20px;color:#F2F2FF}
.bant .bas{min-width:230px}
.bant h1{margin:0;font-size:24px;font-weight:400;color:#F2F2FF}
.bant .alt-bas{font-size:12.5px;color:#D9DFF1;margin-top:2px}
.ara{position:relative;flex:1;max-width:560px}
.ara input{width:100%;height:46px;border-radius:10px;border:1px solid rgba(255,255,255,.85);background:#fff;padding:0 40px 0 44px;font-size:16px;color:#5B5B78;outline:none;box-shadow:0 3px 10px rgba(20,40,90,.18)}
.ara input::placeholder{color:#9090AD}
.ara svg{position:absolute;left:14px;top:13px;width:20px;height:20px;color:#9090AD}
.ara button{position:absolute;right:8px;top:8px;width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:#9090AD;font-size:20px;cursor:pointer;display:none}
.ara.dolu button{display:block}.ara button:hover{background:#EEF1F7;color:#3F68BD}
.kpi{display:flex;gap:10px;margin-left:auto}
.kpi div{min-width:118px;border-radius:10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14);box-shadow:0 3px 10px rgba(30,50,110,.14);padding:8px 14px;text-align:center}
.kpi b{display:block;font-size:28px;font-weight:400;color:#F2F2FF;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:#D9DFF1}
.alt{position:absolute;left:134px;top:136px;width:1122px;height:556px;border-radius:14px;background:rgba(217,223,241,.55);border:1px solid rgba(255,255,255,.5);box-shadow:0 8px 20px rgba(70,95,160,.18)}
.dilim-seridi{position:absolute;left:10px;top:10px;right:10px;height:58px;border-radius:10px;background:linear-gradient(180deg,#F1F3F6,#E6EAEF);box-shadow:0 2px 8px rgba(80,95,140,.14);display:grid;grid-template-columns:1.1fr 1.2fr 1.5fr auto;gap:10px;padding:9px 10px}
.dilim{border-radius:7px;background:linear-gradient(180deg,#DCE2E8,#D1D8E0);box-shadow:inset 0 1px 2px rgba(80,95,140,.18);display:flex;align-items:center;gap:6px;padding:0 8px;min-width:0}
.dilim label{font-size:13px;color:#9090AD;white-space:nowrap}
.dilim select{flex:1;min-width:0;height:28px;border:0;background:transparent;font-size:13px;color:#5B5B78;outline:none;cursor:pointer}
.temizle-dug{appearance:none;border:0;border-radius:7px;background:transparent;color:#3F68BD;font-size:13px;padding:0 12px;cursor:pointer;white-space:nowrap}
.temizle-dug:hover{background:rgba(63,104,189,.1)}.temizle-dug[hidden]{display:none}
.tablo{position:absolute;left:10px;right:10px;top:78px;bottom:10px;overflow:auto;border-radius:10px;background:linear-gradient(160deg,rgba(226,231,243,.8),rgba(205,215,233,.7));border:1px solid rgba(255,255,255,.55)}
.tablo table{width:100%;border-collapse:collapse;font-size:13px;color:#5B5B78;table-layout:fixed}
.tablo th{position:sticky;top:0;z-index:1;text-align:left;font-weight:400;padding:9px 10px 7px;background:rgba(214,221,238,.97);white-space:nowrap;cursor:pointer;user-select:none}
.tablo th:hover{color:#3F68BD}.tablo th .ok{font-size:10px;margin-left:4px;color:#3F68BD}
.tablo td{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tablo tbody tr:hover td{background:rgba(255,255,255,.45)}
.tablo td.ad b{font-weight:600}
.tablo td .suz{cursor:pointer}.tablo td .suz:hover{color:#3F68BD;text-decoration:underline}
.tablo td.tel{white-space:nowrap}
.tel a{color:#3F68BD;text-decoration:none;font-variant-numeric:tabular-nums}.tel a:hover{text-decoration:underline}
.kopya{appearance:none;border:0;background:transparent;color:#9090AD;cursor:pointer;padding:2px 5px;border-radius:5px;margin-left:6px;vertical-align:-3px}
.kopya:hover{background:rgba(63,104,189,.12);color:#3F68BD}.kopya svg{width:15px;height:15px}
.bos{padding:40px;text-align:center;color:#9090AD;font-size:14px}
mark{background:#FFE58A;color:inherit;padding:0 1px;border-radius:2px}
.not{position:absolute;right:16px;bottom:-24px;font-size:11px;color:#9090AD}
.bildirim{position:fixed;left:50%;bottom:56px;transform:translateX(-50%) translateY(10px);background:rgba(31,36,51,.92);color:#fff;font-size:13px;padding:7px 14px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:60}
.bildirim.acik{opacity:1;transform:translateX(-50%)}
/* alt sayfa şeridi: Power BI sayfa sekmeleri gibi (bütün raporlarda aynı) */
#serit{position:fixed;left:0;right:0;bottom:0;height:34px;z-index:30;display:flex;align-items:stretch;background:#F3F4F7;border-top:1px solid #D3D8E2;box-shadow:0 -2px 8px rgba(46,64,120,.08);padding-left:14px}
#serit .ok{display:flex;align-items:center;gap:2px;padding-right:10px;color:#8A93A3;font-size:15px}
#serit .ok a{color:inherit;text-decoration:none;padding:0 5px;border-radius:3px}#serit .ok a:hover{background:#E4E8EF;color:#3D66C0}#serit .ok a.pasif{opacity:.35;pointer-events:none}
#serit .sek{display:flex;align-items:center;padding:0 22px;font-size:13px;color:#5B5B78;text-decoration:none;border-left:1px solid #DDE1E8;position:relative;white-space:nowrap}
#serit .sek:last-of-type{border-right:1px solid #DDE1E8}
#serit .sek:hover{background:#E9ECF2}
#serit .sek.secili{background:#fff;font-weight:600;color:#3F68BD}
#serit .sek.secili::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#5D80C6,#599CAB)}
#serit .sek svg{width:15px;height:15px;margin-right:7px;color:#5F6B78}#serit .sek.secili svg{color:#3D66C0}
#serit .sayi{margin-left:7px;background:#D9822B;color:#fff;border-radius:999px;font-size:10.5px;font-weight:600;padding:0 6px;line-height:16px}#serit .sayi:empty{display:none}
#serit .sag{margin-left:auto;display:flex;align-items:center;padding-right:16px;font-size:11.5px;color:#605E5C}
/* şifre ekranı (yalnız şifreli yayında) */
#kilit{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:linear-gradient(135deg,#D9DFF1 0%,#C1CCE2 55%,#B4C4E1 100%)}
#kilit[hidden]{display:none}
.kilit-kart{width:380px;max-width:calc(100vw - 32px);border-radius:16px;background:linear-gradient(180deg,#FBFCFE,#E9EDF4);box-shadow:0 18px 50px rgba(46,64,120,.35);padding:26px 28px 22px;text-align:center}
.kilit-kart img{width:92px}
.kilit-bant{margin:14px -28px 14px;padding:12px;color:#fff;font-size:17px;background:linear-gradient(115deg,#5D80C6,#599CAB)}
.kilit-kart p{font-size:13px;color:#5B5B78;margin:0 0 14px;line-height:1.45}
.kilit-kart input{width:100%;height:40px;border:1px solid #CBD3E1;border-radius:8px;padding:0 12px;font-size:15px}
.kilit-kart button{margin-top:12px;width:100%;height:40px;border:0;border-radius:8px;color:#fff;font-size:15px;cursor:pointer;background:linear-gradient(115deg,#5D80C6,#599CAB)}
.kilit-hata{min-height:18px;margin-top:10px;font-size:12.5px;color:#B42318}
/* telefon ve dar ekran: alt alta akan düzen, tablo satırları kart olur */
@media (max-width:900px){
  html,body{height:auto;overflow:auto;overflow-x:hidden}
  body{padding-bottom:40px;background:linear-gradient(135deg,#D9DFF1 0%,#C1CCE2 55%,#B4C4E1 100%)}
  #sahne{position:static;width:auto;height:auto;transform:none!important;overflow:visible;background:none}
  .menu{position:sticky;top:0;left:auto;width:auto;height:auto;border-radius:0 0 12px 12px;flex-direction:row;align-items:center;gap:6px;padding:6px 8px;z-index:25}
  .menu .logo{width:36px;margin:0 4px 0 0}
  .mdug{margin-top:0;flex-direction:row;gap:6px;white-space:nowrap}
  .mdug .kut{width:34px;height:34px;border-radius:9px}.mdug .kut svg{width:18px;height:18px}
  .menu .alt-not{display:none}
  .bant,.alt{position:relative;left:auto;top:auto;width:auto;height:auto;margin:10px}
  .bant{flex-wrap:wrap;padding:14px;gap:12px}
  .bant .bas{min-width:0;flex-basis:100%}
  .ara{flex-basis:100%;max-width:none}
  .kpi{margin-left:0;flex-basis:100%}.kpi div{flex:1;min-width:0}
  .alt{padding:10px}
  .dilim-seridi{position:relative;left:auto;top:auto;right:auto;height:auto;grid-template-columns:minmax(0,1fr)}
  .dilim{height:40px}
  .tablo{position:relative;left:auto;right:auto;top:auto;bottom:auto;margin-top:10px;overflow:visible;background:none;border:0}
  .tablo table,.tablo tbody{display:block}.tablo thead{display:none}
  .tablo tbody tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;margin-bottom:8px;padding:10px 12px;border-radius:10px;background:linear-gradient(160deg,rgba(236,240,248,.9),rgba(214,223,238,.8));border:1px solid rgba(255,255,255,.6)}
  .tablo td{display:block;padding:0;border:0;white-space:normal}
  .tablo td.ad{grid-column:1;font-size:15px}.tablo td.tel{grid-column:2;grid-row:1;text-align:right}
  .tablo td.en,.tablo td.emy,.tablo td.bi{grid-column:1/3;font-size:12.5px;color:#9090AD}
  .tablo td.emy:empty{display:none}
  .not{position:static;display:block;text-align:center;margin-top:6px}
  #serit{overflow-x:auto;padding-left:4px}#serit .sag{display:none}#serit .sek{padding:0 12px;font-size:12.5px}#serit .ok{display:none}
}
/* şifre kutusundaki göz: yazılan şifreyi gösterir ya da gizler */
.sifre-kut{position:relative}
.kilit-kart .sifre-kut input{padding-right:46px}
.kilit-kart .goz{position:absolute;right:5px;top:5px;width:30px;height:30px;margin:0;padding:0;border-radius:6px;background:transparent;color:#9090AD;display:grid;place-items:center}
.kilit-kart .goz:hover{background:#EEF1F7;color:#3F68BD}
.kilit-kart .goz svg{width:20px;height:20px}
/* aranabilir süzgeç (28.09.2026): açılır listede arama kutusu; asıl <select> gizli kalır */
.dilim select.ds-gizli{display:none}
.ds-dug{flex:1;min-width:0;height:28px;border:0;background:transparent;font:inherit;font-size:13px;color:#5B5B78;display:flex;align-items:center;gap:6px;cursor:pointer;padding:0 2px;text-align:left}
.ds-dug span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ds-dug svg{width:14px;height:14px;flex:none}
.ds-pano{position:fixed;z-index:90;background:#fff;border-radius:10px;box-shadow:0 12px 32px rgba(40,50,90,.28);border:1px solid #DDE2EC;display:flex;flex-direction:column;overflow:hidden;font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,sans-serif;font-size:13px;color:#5B5B78}
.ds-pano input{margin:8px;height:34px;border:1px solid #CBD3E1;border-radius:7px;padding:0 10px;font:inherit;font-size:13.5px;color:#5B5B78;outline:none}
.ds-pano input:focus{border-color:#3F68BD;box-shadow:0 0 0 3px rgba(63,104,189,.12)}
.ds-liste{overflow:auto;padding:0 4px 6px}
.ds-sec{padding:6px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds-sec:hover,.ds-sec.etkin{background:#EEF1F8}
.ds-sec.secili{color:#3F68BD;font-weight:600}
.ds-sec mark{background:#FFE58A;color:inherit;border-radius:2px}
.ds-bos{padding:8px 10px;color:#9090AD}
</style>
</head>
<body>
<div id="sahne">
  <nav class="menu">
    <img class="logo" src="logo_renkli.svg" alt="TÜBİTAK BİLGEM">
    <button class="mdug" id="temizle" title="Bütün seçimleri temizle"><span class="kut"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg></span></button>
    <button class="mdug secili" title="Kurumsal rehber"><span class="kut"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="15" height="18" rx="2"/><path d="M3 7h3M3 12h3M3 17h3"/><circle cx="12.5" cy="10" r="2.6"/><path d="M8.5 16.5c.8-2 2.3-3 4-3s3.2 1 4 3"/></svg></span>Rehber</button>
    <div class="alt-not" id="kaynak"></div>
  </nav>
  <header class="bant">
    <div class="bas"><h1>Kurumsal rehber</h1><div class="alt-bas" id="alt-bas">BİLGEM telefon rehberi</div></div>
    <div class="ara" id="ara-kut"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="İsim, soyisim, birim ya da telefon ara…" autocomplete="off" aria-label="Rehberde ara"><button id="q-sil" title="Aramayı temizle" aria-label="Aramayı temizle">×</button></div>
    <div class="kpi"><div><b id="k-kisi">–</b><span>kişi</span></div><div><b id="k-birim">–</b><span>birim</span></div></div>
  </header>
  <section class="alt">
    <div class="dilim-seridi" id="dilimler"></div>
    <div class="tablo" id="tablo"></div>
  </section>
</div>
<div class="bildirim" id="bildirim"></div>
<nav id="serit" aria-label="Raporlar">
  <span class="ok"><a data-yon="-1" title="Önceki sayfa">‹</a><a data-yon="1" title="Sonraki sayfa">›</a></span>
  <a class="sek" data-hedef="idari"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>İdari Destek</a>
  <a class="sek" data-hedef="donus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Dönülmemiş Mailler<span class="sayi" id="serit-sayi"></span></a>
  <a class="sek" data-hedef="filo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l2-5.2A2 2 0 0 1 6.9 6.5h10.2a2 2 0 0 1 1.9 1.3L21 13v4H3z"/><circle cx="7.5" cy="17" r="1.8"/><circle cx="16.5" cy="17" r="1.8"/></svg>Filo</a>
  <a class="sek" data-hedef="tanitim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M12 16v4M8 20h8M7 12l3-3 2 2 4-4"/></svg>Tanıtım</a>
  <a class="sek" data-hedef="rehber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="15" height="18" rx="2"/><path d="M3 7h3M3 12h3M3 17h3"/><circle cx="12.5" cy="10" r="2.6"/><path d="M8.5 16.5c.8-2 2.3-3 4-3s3.2 1 4 3"/></svg>Kurumsal Rehber</a>
  <a class="sek" data-hedef="kilavuz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z"/></svg>Rapor Kılavuzu</a>
  <span class="sag" id="serit-sayfa"></span>
</nav>
<script>
/* Alt sayfa şeridi (Power BI sayfa sekmeleri gibi). Yayında site yolları; bu bilgisayarda (file://) yan klasörler.
   Şifre sekme açıkken hatırlandığı için geçişte yeniden sorulmaz. "Dönülmemiş Mailler" İdari Destek raporunun bir sayfasıdır. */
(() => { const SIRA = ["idari", "donus", "filo", "tanitim", "rehber", "kilavuz"], yerel = location.protocol === "file:", idari = yerel ? "../canli_rapor/index.html" : "/idari-destek/";
  // Adres sade kalır: hangi sayfanın açılacağı (ör. Dönülmemiş Mailler) sekme belleğiyle geçer.
  const yol = {idari, donus: yerel ? idari + "#donus" : idari, filo: yerel ? "../filo_rapor/index.html" : "/filo/", tanitim: yerel ? "../tanitim/index.html" : "/idari-destek/tanitim/", rehber: yerel ? "../rehber_rapor/index.html" : "/rehber/", kilavuz: yerel ? "../kilavuz_rapor/index.html" : "/kilavuz/"};
  document.querySelectorAll("#serit .sek").forEach(a => a.href = yol[a.dataset.hedef]);
  document.querySelectorAll("#serit a").forEach(a => a.addEventListener("click", () => { try { if (a.dataset.hedef) sessionStorage.setItem("bilgem_acilis", a.dataset.hedef); } catch (e) {} }));
  window.seritGuncelle = (secili, sayi) => { const i = SIRA.indexOf(secili);
    document.querySelectorAll("#serit .sek").forEach(a => a.classList.toggle("secili", a.dataset.hedef === secili));
    document.querySelectorAll("#serit [data-yon]").forEach(a => { const h = SIRA[i + +a.dataset.yon]; a.classList.toggle("pasif", !h); if (h) { a.href = yol[h]; a.dataset.hedef = h; } else { a.removeAttribute("href"); delete a.dataset.hedef; } });
    document.getElementById("serit-sayfa").textContent = "Sayfa " + (i + 1) + " / " + SIRA.length;
    if (sayi != null) document.getElementById("serit-sayi").textContent = sayi || ""; };
  seritGuncelle("rehber"); })();
</script>
<div id="kilit" hidden>
  <form id="kilit-form" class="kilit-kart" autocomplete="off">
    <img src="logo_renkli.svg" alt="TÜBİTAK BİLGEM">
    <div class="kilit-bant">Kurumsal Rehber</div>
    <p>Bu sayfa kuruma özel bilgiler içerir ve şifrelidir. Size iletilen şifreyi girin.</p>
    <div class="sifre-kut"><input id="kilit-sifre" type="password" placeholder="Şifre" aria-label="Şifre"><button type="button" class="goz" id="kilit-goz" title="Şifreyi göster" aria-label="Şifreyi göster" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <script>(() => { const g = document.getElementById("kilit-sifre"), b = document.getElementById("kilit-goz");
      const ac = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>', kapa = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7c1.9 0 3.6-.6 5-1.4"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
      b.onclick = () => { const goster = g.type === "password"; g.type = goster ? "text" : "password"; b.innerHTML = goster ? kapa : ac;
        b.title = goster ? "Şifreyi gizle" : "Şifreyi göster"; b.setAttribute("aria-label", b.title); b.setAttribute("aria-pressed", goster); g.focus(); }; })();</script>
    <button type="submit">Rehberi aç</button>
    <div id="kilit-hata" class="kilit-hata"></div>

<script>
/* Aranabilir süzgeç (kullanıcı isteği 28.09.2026): sayfadaki her .dilim <select>'i, içinde arama kutusu olan açılır
   listeye dönüşür. Asıl <select> gizli kalır; değeri ve change olayı sayfa kodunda aynen kullanılır. Süzgeçler
   yeniden çizildikçe yenileri de dönüştürülür. Türkçe harf ve büyük/küçük harf farkı gözetilmez. */
(() => {
  const OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  const nk = c => c.toLocaleLowerCase("tr-TR").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/ı/g, "i").charAt(0) || c;
  const norm = s => [...String(s || "")].map(nk).join("");
  let pano = null;
  const kapat = () => { if (pano) { pano.remove(); pano = null; } };
  document.addEventListener("mousedown", e => { if (pano && !pano.contains(e.target) && !e.target.closest(".ds-dug")) kapat(); }, true);
  addEventListener("resize", kapat);
  document.addEventListener("scroll", e => { if (pano && !pano.contains(e.target)) kapat(); }, true);
  function isaretle(t, q) {
    if (!q) return esc(t);
    const n = norm(t), i = n.indexOf(q);
    return i < 0 ? esc(t) : esc(t.slice(0, i)) + "<mark>" + esc(t.slice(i, i + q.length)) + "</mark>" + esc(t.slice(i + q.length));
  }
  function ac(sel, dug) {
    if (pano && pano.sel === sel) { kapat(); return; }
    kapat();
    const r = dug.closest(".dilim").getBoundingClientRect(), en = Math.min(Math.max(r.width, 260), innerWidth - 16);
    const altBos = innerHeight - r.bottom - 44, ustBos = r.top - 12, yukari = altBos < 220 && ustBos > altBos;
    pano = document.createElement("div"); pano.className = "ds-pano"; pano.sel = sel;
    Object.assign(pano.style, {left: Math.max(8, Math.min(r.left, innerWidth - en - 8)) + "px", width: en + "px"},
      yukari ? {bottom: innerHeight - r.top + 4 + "px"} : {top: r.bottom + 4 + "px"});
    pano.innerHTML = `<input type="search" placeholder="Ara…" aria-label="Seçeneklerde ara" autocomplete="off"><div class="ds-liste" role="listbox"></div>`;
    document.body.appendChild(pano);
    const girdi = pano.querySelector("input"), liste = pano.querySelector(".ds-liste");
    liste.style.maxHeight = Math.max(140, Math.min(320, (yukari ? ustBos : altBos) - 56)) + "px";
    const secenek = [...sel.options].map(o => ({v: o.value, t: o.textContent, n: norm(o.textContent)}));
    let gor = [], etkin = 0;
    const ciz = () => {
      const q = norm(girdi.value.trim());
      gor = secenek.filter((o, i) => (i === 0 && o.v === "") || !q || o.n.includes(q));
      etkin = Math.max(0, Math.min(etkin, gor.length - 1));
      liste.innerHTML = gor.map((o, i) => `<div class="ds-sec${o.v === sel.value ? " secili" : ""}${i === etkin ? " etkin" : ""}" data-i="${i}" role="option">${isaretle(o.t, o.v === "" ? "" : q)}</div>`).join("")
        + (q && gor.filter(o => o.v !== "").length === 0 ? `<div class="ds-bos">Eşleşen yok</div>` : "");
      const e = liste.querySelector(".etkin"); if (e) e.scrollIntoView({block: "nearest"});
    };
    const sec = o => { kapat(); if (o && sel.value !== o.v) { sel.value = o.v; sel.dispatchEvent(new Event("change", {bubbles: true})); } };
    liste.addEventListener("mousedown", e => { const d = e.target.closest(".ds-sec"); if (d) { e.preventDefault(); sec(gor[+d.dataset.i]); } });
    girdi.addEventListener("input", () => { etkin = girdi.value.trim() ? gor.length && secenek[0].v === "" ? 1 : 0 : 0; ciz(); });
    girdi.addEventListener("keydown", e => {
      if (e.key === "ArrowDown") { etkin++; ciz(); e.preventDefault(); }
      else if (e.key === "ArrowUp") { etkin--; ciz(); e.preventDefault(); }
      else if (e.key === "Enter") { e.preventDefault(); sec(gor[etkin]); }
      else if (e.key === "Escape") { e.preventDefault(); kapat(); dug.focus(); }
    });
    etkin = Math.max(0, secenek.findIndex(o => o.v === sel.value));
    ciz();
    setTimeout(() => girdi.focus(), 0);
  }
  function donustur(sel) {
    sel.dataset.ds = "1"; sel.classList.add("ds-gizli");
    const dug = document.createElement("button"); dug.type = "button"; dug.className = "ds-dug";
    const yaz = () => { const o = sel.options[sel.selectedIndex]; dug.innerHTML = `<span>${esc(o ? o.textContent : "")}</span>${OK}`; dug.title = o ? o.textContent : ""; };
    yaz(); sel.addEventListener("change", yaz);
    dug.addEventListener("click", e => { e.preventDefault(); ac(sel, dug); });
    dug.addEventListener("keydown", e => { if (e.key === "ArrowDown" || e.key === "Enter" || e.key === " ") { e.preventDefault(); ac(sel, dug); } });
    sel.after(dug);
  }
  const tara = () => document.querySelectorAll(".dilim select:not([data-ds])").forEach(donustur);
  new MutationObserver(tara).observe(document.body, {childList: true, subtree: true});
  tara();
})();
</script>
<script src="veri.enc.js"></script>
<script>
function baslat() {
"use strict";
const V = window.REHBER, $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const sayi = n => (n ?? 0).toLocaleString("tr-TR");
// Türkçe büyük/küçük harf ve aksan duyarsız karşılaştırma; harf harf yapılır ki vurgulamada konumlar kaymasın.
const nk = c => c.toLocaleLowerCase("tr-TR").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ı/g, "i").charAt(0) || c;
const norm = s => [...String(s || "")].map(nk).join("");
const telGor = t => { const r = String(t || "").replace(/\D/g, ""), m = r.match(/^90(\d{3})(\d{3})(\d{2})(\d{2})$/); return m ? `0${m[1]} ${m[2]} ${m[3]} ${m[4]}` : t; };
const AY = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
const trTarih = s => s ? +s.slice(8, 10) + " " + AY[+s.slice(5, 7) - 1] + " " + s.slice(0, 4) : "";

const K = V.kisiler.map((k, i) => ({i, ad: k[0], soyad: k[1], en: k[2], emy: k[3], bi: k[4], tel: k[5]}));
for (const k of K) {
  k.ens = V.enstitu[k.en] || ""; k.emys = V.emy[k.emy] || ""; k.bis = V.birim[k.bi] || "";
  k.idx = norm([k.ad, k.soyad, k.ens, k.emys, k.bis].join(" ")); k.rakam = k.tel.replace(/\D/g, "");
}
const DILIM = [{k: "en", ad: "Enstitü / Başkan Yrd.", liste: V.enstitu}, {k: "emy", ad: "EMY", liste: V.emy}, {k: "bi", ad: "Birim", liste: V.birim}];
const SUTUN = [{k: "ad", ad: "Ad Soyad", en: "22%", f: k => k.ad + " " + k.soyad}, {k: "en", ad: "Enstitü / Başkan Yrd.", en: "17%", f: k => k.ens},
  {k: "emy", ad: "EMY", en: "20%", f: k => k.emys}, {k: "bi", ad: "Birim", en: "25%", f: k => k.bis}, {k: "tel", ad: "Cep telefonu", en: "16%", f: k => k.rakam}];

/* durum: sekme açıkken hatırlanır; adres çubuğu sade kalır */
const D = {q: "", f: {}, sira: "ad", ters: false};
try { Object.assign(D, JSON.parse(sessionStorage.getItem("rehber_durum") || "{}")); } catch (e) {}
D.f = D.f || {};
const kaydet = () => { try { sessionStorage.setItem("rehber_durum", JSON.stringify(D)); } catch (e) {} };

$("#kaynak").innerHTML = `Kaynak<br>Telefon rehberi<br>${esc(trTarih(V.meta.kaynak_tarihi))}`;
$("#alt-bas").textContent = `BİLGEM telefon rehberi · ${sayi(V.meta.kisi)} kişi · ${trTarih(V.meta.kaynak_tarihi)}`;

/* ölçekleme: masaüstünde 16:9 sayfa ekrana sığar, telefonda alt alta akar */
const MQ = matchMedia("(max-width: 900px)");
function olcekle() {
  if (MQ.matches) { $("#sahne").style.transform = "none"; return; }
  const h = innerHeight - 34, s = Math.min(innerWidth / 1280, h / 720);
  $("#sahne").style.transform = `translate(${(innerWidth - 1280 * s) / 2}px,${(h - 720 * s) / 2}px) scale(${s})`;
}
addEventListener("resize", olcekle); olcekle();

function kelimeler() { return norm(D.q).split(/\s+/).filter(Boolean); }
function uyar(k, toks) {
  return toks.every(t => { const r = t.replace(/\D/g, ""); return k.idx.includes(t) || (r.length >= 3 && r.length === t.length && k.rakam.includes(r.replace(/^0/, ""))); });
}
// haric: o süzgecin kendi seçimi yok sayılır (açılır listede diğer seçimlere göre kalan değerler ve sayıları)
function suz(haric) { const toks = kelimeler(); return K.filter(k => DILIM.every(d => d.k === haric || D.f[d.k] == null || k[d.k] === D.f[d.k]) && uyar(k, toks)); }
function vurgula(metin) {
  const toks = kelimeler().filter(t => /\D/.test(t)); if (!toks.length) return esc(metin);
  const n = norm(metin), isaret = new Array(metin.length).fill(false);
  for (const t of toks) { let i = n.indexOf(t); while (i >= 0) { for (let j = i; j < i + t.length; j++) isaret[j] = true; i = n.indexOf(t, i + 1); } }
  let o = "", ac = false;
  [...metin].forEach((c, i) => { if (isaret[i] && !ac) { o += "<mark>"; ac = true; } if (!isaret[i] && ac) { o += "</mark>"; ac = false; } o += esc(c); });
  return o + (ac ? "</mark>" : "");
}
const KOPYA = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>`;

function ciz() {
  $("#ara-kut").classList.toggle("dolu", !!D.q);
  // süzgeçler: her birinde diğer seçimlere ve aramaya göre kalan değerler, sayılarıyla
  $("#dilimler").innerHTML = DILIM.map(d => { const say = new Map(); for (const k of suz(d.k)) if (k[d.k] >= 0) say.set(k[d.k], (say.get(k[d.k]) || 0) + 1);
    const secenek = [...say.keys()].sort((a, b) => d.liste[a].localeCompare(d.liste[b], "tr")); if (D.f[d.k] != null && !say.has(D.f[d.k])) secenek.unshift(D.f[d.k]);
    return `<div class="dilim"><label>${d.ad}</label><select data-k="${d.k}"><option value="">Tümü</option>${secenek.map(v => `<option value="${v}"${D.f[d.k] === v ? " selected" : ""}>${esc(d.liste[v])} (${say.get(v) || 0})</option>`).join("")}</select></div>`; }).join("")
    + `<button class="temizle-dug" id="dilim-temizle"${Object.values(D.f).some(v => v != null) || D.q ? "" : " hidden"}>Seçimleri temizle</button>`;
  $$("#dilimler select").forEach(s => s.onchange = () => { D.f[s.dataset.k] = s.value === "" ? null : +s.value; ciz(); });
  $("#dilim-temizle").onclick = temizle;

  const liste = suz(), sut = SUTUN.find(s => s.k === D.sira) || SUTUN[0], yon = D.ters ? -1 : 1;
  liste.sort((a, b) => yon * String(sut.f(a) || "￿").localeCompare(String(sut.f(b) || "￿"), "tr") || a.i - b.i);
  $("#k-kisi").textContent = sayi(liste.length);
  $("#k-birim").textContent = sayi(new Set(liste.map(k => k.bi)).size);
  const suzme = (alan, no, metin) => metin ? `<span class="suz" data-alan="${alan}" data-no="${no}" title="Bu değere süzmek için tıklayın">${vurgula(metin)}</span>` : "";
  $("#tablo").innerHTML = liste.length ? `<table><colgroup>${SUTUN.map(s => `<col style="width:${s.en}">`).join("")}</colgroup><thead><tr>${SUTUN.map(s => `<th data-k="${s.k}">${s.ad}${s.k === D.sira ? `<span class="ok">${D.ters ? "▼" : "▲"}</span>` : ""}</th>`).join("")}</tr></thead><tbody>`
    + liste.map(k => `<tr><td class="ad"><b>${vurgula(k.ad)}</b> ${vurgula(k.soyad)}</td><td class="en">${suzme("en", k.en, k.ens)}</td><td class="emy">${suzme("emy", k.emy, k.emys)}</td><td class="bi">${suzme("bi", k.bi, k.bis)}</td>`
      + `<td class="tel">${k.tel ? `<a href="tel:${esc(k.tel)}">${esc(telGor(k.tel))}</a><button class="kopya" data-tel="${esc(telGor(k.tel))}" title="Numarayı kopyala" aria-label="Numarayı kopyala">${KOPYA}</button>` : "–"}</td></tr>`).join("")
    + `</tbody></table>` : `<div class="bos">Bu aramaya ve seçimlere uyan kişi yok.</div>`;
  $$("#tablo th").forEach(th => th.onclick = () => { if (D.sira === th.dataset.k) D.ters = !D.ters; else { D.sira = th.dataset.k; D.ters = false; } ciz(); });
  $$("#tablo .suz").forEach(s => s.onclick = () => { const a = s.dataset.alan, n = +s.dataset.no; D.f[a] = D.f[a] === n ? null : n; ciz(); });
  $$("#tablo .kopya").forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.tel); bildir("Numara kopyalandı: " + b.dataset.tel); } catch (e) { bildir("Kopyalanamadı; numarayı seçip kopyalayın"); } });
  kaydet();
}
let bz; function bildir(m) { const b = $("#bildirim"); b.textContent = m; b.classList.add("acik"); clearTimeout(bz); bz = setTimeout(() => b.classList.remove("acik"), 1800); }
// Temizle: arama, süzgeçler, sıralama ve kaydırma başa döner.
function temizle() { Object.assign(D, {q: "", f: {}, sira: "ad", ters: false}); $("#q").value = ""; ciz(); $("#tablo").scrollTop = 0; }
$("#temizle").onclick = temizle;
$("#q").value = D.q;
let zam; $("#q").oninput = e => { clearTimeout(zam); zam = setTimeout(() => { D.q = e.target.value.trim(); ciz(); $("#tablo").scrollTop = 0; }, 150); };
$("#q-sil").onclick = () => { D.q = ""; $("#q").value = ""; ciz(); $("#q").focus(); };
document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); } if (e.key === "Escape" && document.activeElement === $("#q")) { D.q = ""; $("#q").value = ""; ciz(); } });
ciz();
if (!MQ.matches) $("#q").focus();
}

/* Şifreli yayın: veri AES-256-GCM ile şifrelidir (anahtar PBKDF2-SHA256), tarayıcıda şifreyle çözülür.
   Aynı sitedeki raporlar aynı şifreyi kullanır; doğru şifre sekme kapanana kadar hatırlanır. */
async function coz(sifre) {
  const s = window.REHBER_SIFRELI, b64 = x => Uint8Array.from(atob(x), c => c.charCodeAt(0));
  const ham = await crypto.subtle.importKey("raw", new TextEncoder().encode(sifre), "PBKDF2", false, ["deriveKey"]);
  const anahtar = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(s.salt), iterations: s.it, hash: "SHA-256"}, ham, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  const acik = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(s.iv)}, anahtar, b64(s.veri));
  return JSON.parse(await new Response(new Blob([acik]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
}
if (window.REHBER) baslat();
else if (window.REHBER_SIFRELI) {
  const k = document.getElementById("kilit"), f = document.getElementById("kilit-form"), g = document.getElementById("kilit-sifre"), h = document.getElementById("kilit-hata");
  const dene = async s => { window.REHBER = await coz(s); try { sessionStorage.setItem("bilgem_rapor", s); } catch (e) {} k.hidden = true; baslat(); };
  let hatir = null; try { hatir = sessionStorage.getItem("bilgem_rapor"); } catch (e) {}
  (hatir ? dene(hatir) : Promise.reject()).catch(() => { k.hidden = false; g.focus(); });
  f.onsubmit = async e => { e.preventDefault(); h.textContent = "Açılıyor…";
    try { await dene(g.value); g.value = ""; } catch (x) { h.textContent = "Şifre hatalı. Tekrar deneyin."; g.select(); } };
}
</script>
